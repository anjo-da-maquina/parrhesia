name: Core CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify_ataraxia:
    # [緊急修正 2026-10 §CH] ユーザーが実際にGitHub Actions上のログを確認し、
    # 教えてくれたことで発見した退行。GitHubの`ubuntu-latest`ランナーが
    # 2026年10月19日からUbuntu 26へ移行し始めたことを、本ワークフロー自身の
    # annotationが警告していたが、実際に今回(10月25日)その移行の影響を
    # 受けた。`requirements.txt`で固定していたPlaywright 1.56.0が
    # `ubuntu26.04-x64`でのchromiumインストールに対応しておらず、
    # `playwright install chromium --with-deps`が
    # `ERROR: Playwright does not support chromium on ubuntu26.04-x64`で
    # 失敗し、依存関係インストール全体(したがって本ワークフロー全体)が
    # §CGとは無関係にブロックされていた。Playwrightパッケージ自体の
    # バージョンを無検証で上げるより、まだ広く安定運用されている既知の
    # イメージへ明示的に固定する方が、変更の影響範囲が狭く安全であるため、
    # `ubuntu-22.04`へ固定した。
    runs-on: ubuntu-22.04
    # [修正 2026-10 §BQ] 本ジョブが失敗した際、原因の詳細(pytestの具体的な
    # 失敗箇所・トレースバック)を取得する手段がなかった。「Execute Core
    # Verification」ステップの生ログは、GitHub Actions内部の一時blobストレージ
    # ホスト(results-receiver.actions.githubusercontent.com等)にのみ保存され、
    # このリポジトリを操作している実行環境のアウトバウンドプロキシの許可リスト
    # にそのホストが含まれていないため、`gh run view --log`等のあらゆる手段で
    # 「Forbidden」になり、取得不可能だった(実機で確認: §BQ参照)。
    # 失敗の事実(exit code 1)は分かっても、原因が一切分からない状態では、
    # 本リポジトリの核心である「自己検証・正直な自白」ができない。
    # そのため、失敗時のみpytestの出力をコミットコメントとして投稿する
    # (GitHub REST APIのcommits/{sha}/commentsは上記のblobストレージホストとは
    # 別の通常のAPIホストであり、同じ制約を受けない)。これには
    # commits/{sha}/comments へのPOSTが必要なため、デフォルトのリポジトリ設定
    # に依存せず、本ワークフロー自身で明示的に contents: write を宣言する。
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      # [修正 2026-10] 以前は依存パッケージを `pip install pytest rsa` として
      # ここに直接ハードコードしており、requirements.txtとの間でズレが発生
      # していた(実機で発見: requests がテストスイートの一部で必要になった
      # 際、ここへの追記が漏れ、local_arena/selfplay.py の `import requests`
      # が原因で開発者本人ゲートのテストが ModuleNotFoundError でクラッシュして
      # いた)。requirements.txt を単一の正として読み込むことで、このズレを
      # 構造的に防ぐ。
      #
      # [再発 2026-10 §AP] 上記の教訓があったにもかかわらず、その後
      # tests/配下に PyYAML(yaml)・openpyxl を必要とするテストを追加した際、
      # requirements.txt への追記が再び漏れた。これは
      # `.github/workflows/regression_checks_ci.yml`(別のワークフロー)
      # 側で `pip install ... pyyaml ... openpyxl ...` が既に行われていた
      # ため、そちらで動作確認したテストがこのワークフローでも通ると誤って
      # 前提してしまったことが原因である。本ワークフローは
      # requirements.txtのみを単一の正として使うため、他のワークフローの
      # インストール内容はここには一切反映されない。DEFECTS.md §AP参照。
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Execute Core Verification
      id: runtime_seal_verify
      # [修正 2026-10 §BQ] continue-on-error: true により、このステップ単体の
      # 失敗でジョブを即時終了させず、次の「失敗詳細の投稿」ステップを必ず
      # 実行させる。ジョブ全体の成否は、次のステップの最後でoutcomeに応じて
      # 明示的にexitすることで、元の(本来あるべき)挙動と完全に一致させる。
      continue-on-error: true
      run: |
        # クラウド上(未承認環境)で防壁が正しく発動し、遮断されるかを検証
        set -o pipefail
        pytest tests/ -v -s 2>&1 | tee /tmp/runtime_seal_pytest_output.txt

    - name: 失敗時の詳細をコミットコメントとして可視化 (§BQ・ログblobホスト到達不能対策)
      if: steps.runtime_seal_verify.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # GitHub側のコメント本文サイズ上限(65536文字)を超えないよう、
        # 末尾(最も重要な失敗メッセージ・トレースバックが集中する部分)を
        # 優先して60000バイトに切り詰める。
        tail -c 60000 /tmp/runtime_seal_pytest_output.txt > /tmp/runtime_seal_pytest_tail.txt
        {
          echo "### 🔥 Core CI/CD (\`verify_ataraxia\`) — pytest failure"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          echo '```'
          cat /tmp/runtime_seal_pytest_tail.txt
          echo '```'
        } > /tmp/runtime_seal_pytest_comment_body.md
        # [実装中の自己訂正(自白) §BQ] 当初 `-f body=@...` と書いていたが、
        # `gh api`の`@<path>`ファイル読み込み構文は`-F/--field`専用であり、
        # `-f/--raw-field`では文字列"@/tmp/..."がそのまま送信されてしまう
        # (= コメント本文がファイルの内容ではなく、ファイルパスの文字列その
        # ものになる)ことを、実機で実際にこの誤った投稿が行われたのを見て
        # 発見した。本来確認すべきこと(「診断用に追加した仕組み自体が実際に
        # 正しく動くか」)を怠っていたこと自体が、§BPで一般化した「有効側の
        # 分岐を実際に踏んで確認する」という教訓への違反であり、素直に認める。
        gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
          -F body=@/tmp/runtime_seal_pytest_comment_body.md
        # ジョブ自体は、元の(continue-on-errorが無かった場合と同じ)結果である
        # 「失敗」として正しく報告する。
        exit 1

  # [新設 2026-11] evals/diff_audit/ のInspect(inspect_ai)タスクが実際に
  # 配線されて走るかを検証する専用ジョブ。`verify_ataraxia`(上記、本来の
  # テストスイート)とは完全に独立した別ジョブにすることで、このジョブの
  # 成否が本来のテストスイートの結果と混同されないようにする。
  #
  # このタスクはPyPIから`inspect-ai`(任意依存、pyproject.tomlの
  # [project.optional-dependencies].evals)をインストールする必要があるが、
  # このリポジトリを開発している作業用サンドボックスにはPyPIへの
  # ネットワーク到達性が無く、そちらでは一度もインストール・実行できて
  # いない(詳細はevals/diff_audit/README.md)。GitHub Actionsのランナーには
  # 通常のネットワーク到達性があるため、本ジョブで実際に
  # `pip install inspect-ai`してモックプロバイダでの配線確認を行う。
  verify_evals_diff_audit_wiring:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies (including inspect-ai via the evals extra)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ".[evals]"

    - name: Regenerate evals/diff_audit/ dataset
      # 念のため、コミット済みのdata/*.jsonlではなくこの場で再生成した
      # ものを使う(ビルドスクリプト自体が壊れていないことも同時に確認する)。
      run: python3 evals/diff_audit/build_dataset.py

    - name: Run evals/diff_audit/ regression tests (inspect_ai available here)
      # このジョブではinspect_aiが実際にインストールされているため、
      # 開発用サンドボックス(inspect_ai無し)では
      # `pytest.importorskip`によりskipされていた
      # test_task_module_importable_when_inspect_ai_present が、ここでは
      # 実際に実行されてpassすることを確認する。
      run: python3 -m pytest tests/test_evals_diff_audit.py -v

    - name: Inspect wiring check (mock provider)
      id: inspect_mock_run
      run: |
        set -o pipefail
        inspect eval "evals/diff_audit/task.py@diff_audit_eval" --model mockllm/model --limit 3 \
          2>&1 | tee /tmp/inspect_mock_run_output.txt

    - name: 失敗時の詳細をコミットコメントとして可視化
      if: failure() && steps.inspect_mock_run.outcome == 'failure'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tail -c 60000 /tmp/inspect_mock_run_output.txt > /tmp/inspect_mock_run_tail.txt
        {
          echo "### 🔥 Core CI/CD (\`verify_evals_diff_audit_wiring\`) — inspect eval mock run failure"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo
          echo '```'
          cat /tmp/inspect_mock_run_tail.txt
          echo '```'
        } > /tmp/inspect_mock_run_comment_body.md
        gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
          -F body=@/tmp/inspect_mock_run_comment_body.md
