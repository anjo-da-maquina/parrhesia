[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runtime_guard"
version = "0.1.0"
authors = [
  { name="anjo-da-maquina" }
]
description = "Zero-Trust OS Fortress for Local AI Agents"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[project.optional-dependencies]
# [新設 2026-11] evals/diff_audit/ のInspect(inspect_ai)タスクを実行する
# ためだけの任意依存。通常のインストール・CI・pytest全件には不要。
evals = ["inspect-ai"]

[tool.setuptools]
packages = ["runtime_guard"]